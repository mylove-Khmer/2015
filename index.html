<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC - Movie Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Kantumruy Pro', sans-serif;
      background-color: #0d0d11; 
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-white pb-24 select-none">

  <!-- Navbar -->
  <header class="fixed top-0 inset-x-0 h-16 bg-black/70 backdrop-blur-md z-40 flex items-center justify-between px-4 md:px-8 border-b border-white/5">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center font-black text-black text-lg shadow-lg shadow-amber-500/20">A</div>
      <span class="text-lg md:text-xl font-bold tracking-tight text-white">Angkor DC</span>
    </div>
    <div class="w-9 h-9 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center">
      <i data-lucide="user" class="w-5 h-5 text-neutral-300"></i>
    </div>
  </header>

  <!-- Hero Section -->
  <div id="heroSection" class="relative h-[68vh] flex flex-col justify-end px-6 pb-8"></div>

  <!-- Movie List Carousel -->
  <section class="px-6 mt-4">
    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
      <i data-lucide="film" class="w-4 h-4 text-amber-400"></i>
      <span>ភាពយន្ត និងរឿងភាគទាំងអស់</span>
    </h2>
    <div id="moviesRow" class="flex gap-4 overflow-x-auto no-scrollbar pb-4"></div>
  </section>

  <!-- Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-[#0d0d11]/95 border-t border-neutral-800 backdrop-blur-md flex justify-around py-3 z-40 text-neutral-400 text-xs">
    <div class="flex flex-col items-center gap-1 text-amber-500 cursor-pointer">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span>Home</span>
    </div>
    <div class="flex flex-col items-center gap-1 hover:text-white cursor-pointer">
      <i data-lucide="search" class="w-5 h-5"></i>
      <span>Search</span>
    </div>
    <div class="flex flex-col items-center gap-1 hover:text-white cursor-pointer">
      <i data-lucide="bell" class="w-5 h-5"></i>
      <span>Notifications</span>
    </div>
    <div class="flex flex-col items-center gap-1 hover:text-white cursor-pointer">
      <i data-lucide="film" class="w-5 h-5"></i>
      <span>Library</span>
    </div>
  </nav>

  <!-- Video Player Modal -->
  <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-start overflow-y-auto p-4 md:p-8">
    <div class="w-full max-w-4xl relative mt-2 md:mt-6">
      <div class="flex items-center justify-between mb-3">
        <h3 id="playerMovieTitle" class="font-bold text-base md:text-lg text-amber-400 truncate">ចំណងជើងរឿង</h3>
        <button onclick="closePlayer()" class="text-neutral-400 hover:text-white flex items-center gap-1 font-bold text-xs bg-neutral-800 px-3 py-2 rounded-xl border border-neutral-700">
          <i data-lucide="x" class="w-4 h-4"></i> បិទ
        </button>
      </div>

      <div class="w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-neutral-800 mb-5">
        <video id="mainVideo" controls playsinline class="w-full aspect-video">
          <source id="videoSource" src="" type="video/mp4">
        </video>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 md:p-6 mb-8">
        <h4 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
          <i data-lucide="list-video" class="w-4 h-4 text-amber-400"></i> ជ្រើសរើសភាគដើម្បីទស្សនា៖
        </h4>
        <div id="episodesListContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5"></div>
      </div>
    </div>
  </div>

  <!-- Modal ស្កេន KHQR (លោតគ្រប់ភាគទាំងអស់បើអត់ទាន់បង់ប្រាក់) -->
  <div id="qrPayModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden items-center justify-center p-4 overflow-y-auto">
    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-5 md:p-7 max-w-md w-full relative shadow-2xl text-center my-auto">
      <button onclick="closeQrModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white bg-neutral-800 p-1.5 rounded-full">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h3 class="text-lg font-black text-white mb-1">ស្កេន KHQR ដើម្បីទស្សនា</h3>
      <p id="qrMovieNotice" class="text-xs text-amber-400 mb-1 font-semibold">រឿង៖ បណ្តាសាក្រៅ ២ ($2.50)</p>
      <p class="text-[11px] text-neutral-400 mb-3">លោកអ្នកមិនទាន់បានបង់ប្រាក់ទស្សនារឿងនេះទេ។ សូមស្កេន KHQR ខាងក្រោមដើម្បីបង់ប្រាក់៖</p>

      <!-- រូប QR Code ទំហំធំ ច្បាស់ល្អ -->
      <div class="bg-white p-3 rounded-2xl inline-block mb-4 border-2 border-red-500 shadow-2xl max-w-[280px] md:max-w-[320px] w-full">
        <img id="guestKhqrImg" src="khqr.png" class="w-full h-auto object-contain mx-auto rounded-xl" />
      </div>

      <!-- Form ផ្ញើ Slip ទៅ Telegram Bot -->
      <form id="slipForm" class="space-y-3 text-left">
        <div>
          <label class="text-xs text-neutral-300 block mb-1">តម្លៃត្រូវបង់ ($)៖</label>
          <input type="text" id="slipAmount" readonly class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-2.5 text-sm font-bold text-amber-400 cursor-not-allowed">
        </div>

        <div>
          <label class="text-xs text-neutral-300 block mb-1">ជ្រើសរើសរូបថតវិក្កយបត្រ (Slip)៖</label>
          <input type="file" id="slipFileInput" accept="image/*" required class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-2 text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-amber-500 file:text-black file:font-bold cursor-pointer">
        </div>

        <button type="submit" id="sendSlipBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-xl transition active:scale-98 flex items-center justify-center gap-2 text-sm shadow-lg shadow-amber-500/20">
          <i data-lucide="send" class="w-4 h-4"></i>
          <span>ផ្ញើវិក្កយបត្រទៅកាន់អេតមីន</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    const TELEGRAM_BOT_TOKEN = "8870525233:AAEMYx2LPfOTgc5CZoC8Q2wVhvIxKeXjt00";
    const TELEGRAM_CHAT_ID = "5915683588";
    const DEFAULT_QR = "khqr.png";

    let allMovies = [];
    let selectedMovieToPay = null;
    let currentMovie = null;
    let currentEpIndex = 0;

    function getUserId() {
      let id = localStorage.getItem('guest_user_id');
      if (!id) {
        id = 'AK-' + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('guest_user_id', id);
      }
      return id;
    }

    function getPurchasedMovies() {
      const p = localStorage.getItem(`unlocked_${getUserId()}`);
      return p ? JSON.parse(p) : [];
    }

    function addPurchasedMovie(id) {
      const p = getPurchasedMovies();
      if (!p.includes(id)) {
        p.push(id);
        localStorage.setItem(`unlocked_${getUserId()}`, JSON.stringify(p));
      }
    }

    function isMovieUnlocked(movie) {
      const priceStr = (movie.price || '').toLowerCase().replace('$', '').trim();
      const priceNum = parseFloat(priceStr);
      if (priceStr === 'free' || priceNum === 0) return true;
      return getPurchasedMovies().includes(movie.id);
    }

    function parseMoviePrice(priceStr) {
      const p = (priceStr || '').toLowerCase().replace('$', '').trim();
      const num = parseFloat(p);
      return isNaN(num) ? 0 : num;
    }

    function showPayModal(movie) {
      selectedMovieToPay = movie;
      const price = parseMoviePrice(movie.price);

      document.getElementById('qrMovieNotice').innerText = `រឿង៖ ${movie.title} (${movie.price})`;
      document.getElementById('slipAmount').value = `${price.toFixed(2)}`;
      document.getElementById('guestKhqrImg').src = DEFAULT_QR;

      document.getElementById('qrPayModal').classList.remove('hidden');
      document.getElementById('qrPayModal').classList.add('flex');
    }

    function handleWatchClick(movieId, targetEpIndex = 0) {
      const movie = allMovies.find(m => m.id === movieId);
      if (!movie) return;

      if (!isMovieUnlocked(movie)) {
        showPayModal(movie);
        return;
      }

      openPlayer(movieId, targetEpIndex);
    }

    function closeQrModal() {
      document.getElementById('qrPayModal').classList.add('hidden');
      document.getElementById('qrPayModal').classList.remove('flex');
    }

    document.getElementById('slipForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('sendSlipBtn');
      const file = document.getElementById('slipFileInput').files[0];
      const amount = document.getElementById('slipAmount').value;
      const uid = getUserId();
      const movieTitle = selectedMovieToPay ? selectedMovieToPay.title : 'វីដេអូ';
      const movieId = selectedMovieToPay ? selectedMovieToPay.id : '';

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-1">⏳</span> កំពុងផ្ញើទៅ Admin...`;

      try {
        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_CHAT_ID);
        formData.append('photo', file);
        formData.append('parse_mode', 'HTML');
        formData.append('caption', `🔔 <b>មានការស្នើសុំទស្សនារឿងថ្មី!</b>\n\n🎬 <b>រឿង:</b> ${movieTitle}\n👤 <b>User ID:</b> <code>${uid}</code>\n💵 <b>តម្លៃ:</b> $${amount}\n⏰ <b>ម៉ោង:</b> ${new Date().toLocaleTimeString()}`);
        
        const inlineKeyboard = {
          inline_keyboard: [
            [
              { text: `✅ អនុម័តឱ្យមើល ($${amount})`, callback_data: `APPROVE:${uid}:${amount}:${movieId}` },
              { text: `❌ បដិសេធ`, callback_data: `REJECT:${uid}` }
            ]
          ]
        };
        formData.append('reply_markup', JSON.stringify(inlineKeyboard));

        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (data.ok) {
          alert('✅ វិក្កយបត្រត្រូវបានផ្ញើជូន Admin ជោគជ័យ! សូមរង់ចាំ Admin ចុចអនុម័ត នោះវីដេអូនឹងចាក់ជូនភ្លាមៗ។');
          closeQrModal();
          document.getElementById('slipForm').reset();
        } else {
          alert('មានបញ្ហាក្នុងការផ្ញើទៅកាន់ Bot');
        }
      } catch (err) {
        alert('ផ្ញើបរាជ័យ សូមពិនិត្យអ៊ីនធឺណិត');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> <span>ផ្ញើវិក្កយបត្រទៅកាន់អេតមីន</span>`;
        lucide.createIcons();
      }
    });

    let lastUpdateId = 0;
    async function checkTelegramUpdates() {
      try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`);
        const data = await res.json();
        if (data.ok && data.result.length > 0) {
          for (const update of data.result) {
            lastUpdateId = update.update_id;

            if (update.callback_query) {
              const callbackData = update.callback_query.data;
              const [action, targetUid, amt, targetMovieId] = callbackData.split(':');
              const myUid = getUserId();

              if (targetUid === myUid) {
                if (action === 'APPROVE') {
                  if (targetMovieId) {
                    addPurchasedMovie(targetMovieId);
                  }

                  await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery?callback_query_id=${update.callback_query.id}&text=បានអនុម័តជោគជ័យ!`);
                  await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageCaption`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      chat_id: TELEGRAM_CHAT_ID,
                      message_id: update.callback_query.message.message_id,
                      caption: `✅ <b>បានអនុម័តឱ្យ User ${myUid} ទស្សនារួចរាល់! ($${amt})</b>`,
                      parse_mode: 'HTML'
                    })
                  });

                  alert(`🎉 អបអរសាទរ! អេតមីនបានអនុម័តរួចរាល់ហើយ។ សូមរីករាយទស្សនា!`);
                  if (targetMovieId) {
                    openPlayer(targetMovieId, 0);
                  }
                } else if (action === 'REJECT') {
                  await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery?callback_query_id=${update.callback_query.id}&text=បានបដិសេធ!`);
                  await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageCaption`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      chat_id: TELEGRAM_CHAT_ID,
                      message_id: update.callback_query.message.message_id,
                      caption: `❌ <b>បានបដិសេធការស្នើសុំរបស់ User ${myUid}!</b>`,
                      parse_mode: 'HTML'
                    })
                  });

                  alert(`❌ ការស្នើសុំទស្សនារបស់អ្នកត្រូវបានបដិសេធ។`);
                }
              }
            }
          }
        }
      } catch (e) {}
    }

    setInterval(checkTelegramUpdates, 3000);

    async function loadData() {
      try {
        const res = await fetch('movies.json?t=' + Date.now());
        if (res.ok) {
          allMovies = await res.json();
        } else {
          const local = localStorage.getItem('angkor_movies');
          allMovies = local ? JSON.parse(local) : [];
        }
      } catch (e) {
        const local = localStorage.getItem('angkor_movies');
        allMovies = local ? JSON.parse(local) : [];
      }

      if (allMovies.length > 0) {
        const hero = allMovies[0];
        document.getElementById('heroSection').innerHTML = `
          <img src="${hero.cover}" class="absolute inset-0 w-full h-full object-cover -z-10 brightness-75" />
          <div class="absolute inset-0 bg-gradient-to-t from-[#0d0d11] via-[#0d0d11]/50 to-transparent -z-10"></div>
          <div class="max-w-xl">
            <span class="text-xs bg-amber-500 text-black font-black px-2.5 py-1 rounded-lg uppercase tracking-wider mb-2 inline-block shadow">តម្លៃ៖ ${hero.price}</span>
            <h1 class="text-3xl font-black mb-4 leading-tight">${hero.title}</h1>
            <button onclick="handleWatchClick('${hero.id}', 0)" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-xl flex items-center gap-2 transition active:scale-95 shadow-lg shadow-amber-500/20">
              <i data-lucide="play" class="w-5 h-5 fill-black"></i> ទស្សនាឥឡូវនេះ
            </button>
          </div>
        `;

        document.getElementById('moviesRow').innerHTML = allMovies.map(m => `
          <div onclick="handleWatchClick('${m.id}', 0)" class="min-w-[140px] md:min-w-[170px] rounded-2xl overflow-hidden bg-neutral-900 border border-neutral-800 cursor-pointer hover:border-amber-500 hover:scale-105 transition duration-200 shadow-lg">
            <div class="relative">
              <img src="${m.cover}" class="w-full h-48 object-cover" />
              <span class="absolute top-2 right-2 bg-black/80 backdrop-blur-md text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-lg">${m.price}</span>
            </div>
            <div class="p-3">
              <p class="text-xs font-semibold truncate text-white">${m.title}</p>
              <p class="text-[10px] text-neutral-400 mt-0.5">${m.episodes ? m.episodes.length : 1} ភាគ</p>
            </div>
          </div>
        `).join('');
      }
      lucide.createIcons();
    }

    const modal = document.getElementById('videoModal');
    const video = document.getElementById('mainVideo');
    const videoSource = document.getElementById('videoSource');

    function openPlayer(movieId, epIndex = 0) {
      currentMovie = allMovies.find(m => m.id === movieId);
      if (!currentMovie) return;

      if (!isMovieUnlocked(currentMovie)) {
        closePlayer();
        showPayModal(currentMovie);
        return;
      }

      const eps = currentMovie.episodes || [{ epTitle: 'ភាគ ១', videoUrl: currentMovie.videoUrl }];
      currentMovie.episodes = eps;

      playEpisode(epIndex);
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function playEpisode(index) {
      if (!currentMovie || !isMovieUnlocked(currentMovie)) {
        closePlayer();
        showPayModal(currentMovie);
        return;
      }

      currentEpIndex = index;
      const ep = currentMovie.episodes[index];
      if (!ep) return;

      document.getElementById('playerMovieTitle').innerText = `${currentMovie.title} - ${ep.epTitle}`;
      videoSource.src = ep.videoUrl;
      video.load();
      video.play().catch(e => console.log('Autoplay prevent:', e));

      renderEpisodesList();
    }

    function renderEpisodesList() {
      const container = document.getElementById('episodesListContainer');
      container.innerHTML = currentMovie.episodes.map((ep, idx) => {
        const isActive = idx === currentEpIndex;
        return `
          <button onclick="playEpisode(${idx})" class="p-3 rounded-xl border text-xs font-bold transition flex items-center justify-between ${
            isActive 
              ? 'bg-amber-500 text-black border-amber-500 shadow-lg shadow-amber-500/20' 
              : 'bg-neutral-800/80 hover:bg-neutral-800 text-neutral-300 border-neutral-700 hover:border-neutral-500'
          }">
            <span class="truncate">${ep.epTitle}</span>
            <i data-lucide="${isActive ? 'volume-2' : 'play'}" class="w-4 h-4 shrink-0"></i>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    video.onended = () => {
      if (currentMovie && currentEpIndex + 1 < currentMovie.episodes.length) {
        playEpisode(currentEpIndex + 1);
      }
    };

    function closePlayer() {
      video.pause();
      videoSource.src = '';
      video.load();
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    loadData();
  </script>
</body>
</html>
