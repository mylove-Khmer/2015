<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC - Movie Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0d0d11; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-white pb-24 select-none font-sans">

  <!-- Navbar -->
  <header class="fixed top-0 inset-x-0 h-16 bg-black/60 backdrop-blur-md z-40 flex items-center justify-between px-6 border-b border-white/5">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center font-black text-black text-lg">A</div>
      <span class="text-xl font-bold tracking-tight">Angkor DC</span>
    </div>
    <a href="admin.html" class="text-xs bg-neutral-800 text-neutral-300 hover:text-white px-3 py-1.5 rounded-full border border-neutral-700">
      ចូល Admin
    </a>
  </header>

  <!-- Hero Section -->
  <div id="heroSection" class="relative h-[68vh] flex flex-col justify-end px-6 pb-8">
    <!-- Rendered by JS -->
  </div>

  <!-- Movie List Carousel -->
  <section class="px-6 mt-4">
    <h2 class="text-lg font-bold mb-4">ភាពយន្តទាំងអស់</h2>
    <div id="moviesRow" class="flex gap-4 overflow-x-auto no-scrollbar pb-4">
      <!-- Rendered by JS -->
    </div>
  </section>

  <!-- Video Player Modal -->
  <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl relative">
      <button onclick="closePlayer()" class="absolute -top-10 right-0 text-neutral-400 hover:text-white flex items-center gap-1 font-bold text-sm">
        <i data-lucide="x" class="w-6 h-6"></i> បិទ
      </button>
      <div class="w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-neutral-800">
        <video id="mainVideo" controls class="w-full aspect-video">
          <source src="" type="video/mp4">
        </video>
      </div>
    </div>
  </div>

  <script>
    const defaultMovies = [
      { id: '1', title: 'បណ្តាសាក្រៅ ២', price: '$2.50', cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80', videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' }
    ];

    function loadData() {
      const data = localStorage.getItem('angkor_movies');
      const movies = data ? JSON.parse(data) : defaultMovies;

      if (movies.length > 0) {
        const hero = movies[0];
        document.getElementById('heroSection').innerHTML = `
          <img src="${hero.cover}" class="absolute inset-0 w-full h-full object-cover -z-10 brightness-75" />
          <div class="absolute inset-0 bg-gradient-to-t from-[#0d0d11] via-[#0d0d11]/40 to-transparent -z-10"></div>
          <div class="max-w-xl">
            <span class="text-xs bg-amber-500 text-black font-black px-2 py-0.5 rounded uppercase tracking-wider mb-2 inline-block">តម្លៃ៖ ${hero.price}</span>
            <h1 class="text-3xl font-black mb-4">${hero.title}</h1>
            <button onclick="openPlayer('${hero.videoUrl}')" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-xl flex items-center gap-2">
              <i data-lucide="play" class="w-5 h-5 fill-black"></i> Play Now
            </button>
          </div>
        `;

        document.getElementById('moviesRow').innerHTML = movies.map(m => `
          <div onclick="openPlayer('${m.videoUrl}')" class="min-w-[140px] md:min-w-[170px] rounded-xl overflow-hidden bg-neutral-900 border border-neutral-800 cursor-pointer hover:border-amber-500 hover:scale-105 transition duration-200">
            <div class="relative">
              <img src="${m.cover}" class="w-full h-48 object-cover" />
              <span class="absolute top-2 right-2 bg-black/80 backdrop-blur-md text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded">${m.price}</span>
            </div>
            <div class="p-3">
              <p class="text-xs font-semibold truncate text-white">${m.title}</p>
            </div>
          </div>
        `).join('');
      } else {
        document.getElementById('heroSection').innerHTML = `<p class="text-center text-neutral-500">មិនទាន់មានវីដេអូសម្រាប់ចាក់នៅឡើយទេ។</p>`;
        document.getElementById('moviesRow').innerHTML = '';
      }
      lucide.createIcons();
    }

    const modal = document.getElementById('videoModal');
    const video = document.getElementById('mainVideo');

    function openPlayer(url) {
      video.src = url;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      video.play();
    }

    function closePlayer() {
      video.pause();
      video.src = '';
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    loadData();
  </script>
</body>
</html>
