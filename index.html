<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC - Movie Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0d0d11; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-white pb-24 select-none font-sans">

  <!-- Navbar -->
  <header class="fixed top-0 inset-x-0 h-16 bg-black/60 backdrop-blur-md z-40 flex items-center justify-between px-4 md:px-8 border-b border-white/5">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center font-black text-black text-lg shadow-lg shadow-amber-500/20">A</div>
      <span class="text-lg md:text-xl font-bold tracking-tight">Angkor DC</span>
    </div>

    <!-- User Info & Balance -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-neutral-900 border border-amber-500/30 px-3 py-1.5 rounded-full">
        <i data-lucide="wallet" class="w-4 h-4 text-amber-400"></i>
        <div class="text-xs text-left">
          <span class="text-neutral-400 text-[9px] block leading-none">សមតុល្យ</span>
          <span id="userBalanceDisplay" class="font-bold text-amber-400">$0.00</span>
        </div>
      </div>
      <div class="w-9 h-9 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center">
        <i data-lucide="user" class="w-5 h-5 text-neutral-300"></i>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <div id="heroSection" class="relative h-[68vh] flex flex-col justify-end px-6 pb-8"></div>

  <!-- Movie List Carousel -->
  <section class="px-6 mt-4">
    <h2 class="text-lg font-bold mb-4">ភាពយន្ត និងរឿងភាគទាំងអស់</h2>
    <div id="moviesRow" class="flex gap-4 overflow-x-auto no-scrollbar pb-4"></div>
  </section>

  <!-- Bottom Navigation Bar -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-[#0d0d11]/95 border-t border-neutral-800 backdrop-blur-md flex justify-around py-3 z-40 text-neutral-400 text-xs">
    <div class="flex flex-col items-center gap-1 text-amber-500 cursor-pointer">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span>Home</span>
    </div>
    <div class="flex flex-col items-center gap-1 hover:text-white cursor-pointer">
      <i data-lucide="search" class="w-5 h-5"></i>
      <span>Search</span>
    </div>
    <div class="flex flex-col items-center gap-1 hover:text-white cursor-pointer">
      <i data-lucide="film" class="w-5 h-5"></i>
      <span>Library</span>
    </div>
  </nav>

  <!-- Video Player Modal -->
  <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-start overflow-y-auto p-4 md:p-8">
    <div class="w-full max-w-4xl relative mt-2 md:mt-6">
      <div class="flex items-center justify-between mb-3">
        <h3 id="playerMovieTitle" class="font-bold text-base md:text-lg text-amber-400 truncate">ចំណងជើងរឿង</h3>
        <button onclick="closePlayer()" class="text-neutral-400 hover:text-white flex items-center gap-1 font-bold text-sm bg-neutral-800/80 px-3 py-1.5 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i> បិទ
        </button>
      </div>

      <div class="w-full bg-black rounded-2xl overflow-hidden shadow-2xl border border-neutral-800 mb-5">
        <video id="mainVideo" controls playsinline class="w-full aspect-video">
          <source id="videoSource" src="" type="video/mp4">
        </video>
      </div>

      <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 md:p-6 mb-8">
        <h4 class="text-sm font-bold text-white mb-3 flex items-center gap-2">
          <i data-lucide="list-video" class="w-4 h-4 text-amber-400"></i> ជ្រើសរើសភាគដើម្បីទស្សនា៖
        </h4>
        <div id="episodesListContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5"></div>
      </div>
    </div>
  </div>

  <!-- Modal ស្កេន KHQR (លោតចេញភ្លាមៗពេលភ្ញៀវចុចលើរឿង) -->
  <div id="qrPayModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-sm w-full relative shadow-2xl text-center">
      <button onclick="closeQrModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h3 class="text-base font-bold text-white mb-1">ស្កេន KHQR ដើម្បីទស្សនា</h3>
      <p id="qrMovieNotice" class="text-xs text-amber-400 mb-3 font-semibold">រឿង៖ បណ្តាសាក្រៅ ២ ($2.50)</p>

      <!-- រូប QR Code របស់អ្នក -->
      <div class="bg-white p-2 rounded-2xl inline-block mb-3 border-2 border-red-600 shadow-lg">
        <img id="guestKhqrImg" src="khqr.png" class="w-44 h-44 object-contain mx-auto" />
      </div>

      <!-- Form ផ្ញើ Slip ទៅ Telegram Bot -->
      <form id="slipForm" class="space-y-3 text-left">
        <div>
          <label class="text-[11px] text-neutral-400 block mb-1">តម្លៃត្រូវបង់ ($)៖</label>
          <input type="text" id="slipAmount" readonly class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-xs font-bold text-amber-400 cursor-not-allowed">
        </div>

        <div>
          <label class="text-[11px] text-neutral-400 block mb-1">ជ្រើសរើសរូបថតវិក្កយបត្រ (Slip)៖</label>
          <input type="file" id="slipFileInput" accept="image/*" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-1.5 text-xs file:mr-2 file:py-1 file:px-2.5 file:rounded file:border-0 file:bg-amber-500 file:text-black file:font-bold cursor-pointer">
        </div>

        <button type="submit" id="sendSlipBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-2.5 rounded-xl transition active:scale-98 flex items-center justify-center gap-1.5 text-xs">
          <i data-lucide="send"></i> ផ្ញើវិក្កយបត្រទៅកាន់អេតមីន
        </button>
      </form>
    </div>
  </div>

  <script>
    const TELEGRAM_BOT_TOKEN = "8870525233:AAEMYx2LPfOTgc5CZoC8Q2wVhvIxKeXjt00";
    const TELEGRAM_CHAT_ID = "5915683588";
    const DEFAULT_QR = "khqr.png";

    let selectedMovieToPay = null;

    function getUserId() {
      let id = localStorage.getItem('guest_user_id');
      if (!id) {
        id = 'AK-' + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('guest_user_id', id);
      }
      return id;
    }

    function getBalance() {
      const uid = getUserId();
      const bal = localStorage.getItem(`wallet_bal_${uid}`);
      return bal !== null ? parseFloat(bal) : 0.00;
    }

    function setBalance(amount) {
      const uid = getUserId();
      localStorage.setItem(`wallet_bal_${uid}`, amount.toFixed(2));
      updateBalanceUI();
    }

    function updateBalanceUI() {
      document.getElementById('userBalanceDisplay').innerText = `$${getBalance().toFixed(2)}`;
    }

    const defaultMovies = [
      { 
        id: '1', 
        title: 'បណ្តាសាក្រៅ ២', 
        price: '$2.50', 
        cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80', 
        episodes: [
          { epTitle: 'ភាគ ១', videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' }
        ]
      }
    ];

    let currentMovie = null;
    let currentEpIndex = 0;

    function getPurchasedMovies() {
      const p = localStorage.getItem(`unlocked_${getUserId()}`);
      return p ? JSON.parse(p) : [];
    }

    function addPurchasedMovie(id) {
      const p = getPurchasedMovies();
      if (!p.includes(id)) {
        p.push(id);
        localStorage.setItem(`unlocked_${getUserId()}`, JSON.stringify(p));
      }
    }

    function isMovieUnlocked(movie) {
      const priceStr = (movie.price || '').toLowerCase().replace('$', '').trim();
      const priceNum = parseFloat(priceStr);
      if (isNaN(priceNum) || priceNum === 0 || priceStr === 'free') return true;
      return getPurchasedMovies().includes(movie.id);
    }

    function parseMoviePrice(priceStr) {
      const p = (priceStr || '').toLowerCase().replace('$', '').trim();
      const num = parseFloat(p);
      return isNaN(num) ? 0 : num;
    }

    // ពេលភ្ញៀវចុចលើរឿងណាមួយ
    function handleWatchClick(movieId) {
      const data = localStorage.getItem('angkor_movies');
      const movies = data ? JSON.parse(data) : defaultMovies;
      const movie = movies.find(m => m.id === movieId);
      if (!movie) return;

      // បើរឿងទិញរួច ឬ Free -> ចាក់មើលភ្លាម
      if (isMovieUnlocked(movie)) {
        openPlayer(movieId, 0);
        return;
      }

      // បើមិនទាន់ទិញ -> លោតផ្ទាំង QR ភ្លាមៗ
      selectedMovieToPay = movie;
      const price = parseMoviePrice(movie.price);

      document.getElementById('qrMovieNotice').innerText = `រឿង៖ ${movie.title} (${movie.price})`;
      document.getElementById('slipAmount').value = `${price.toFixed(2)}`;
      document.getElementById('guestKhqrImg').src = localStorage.getItem('angkor_khqr_image') || DEFAULT_QR;

      document.getElementById('qrPayModal').classList.remove('hidden');
      document.getElementById('qrPayModal').classList.add('flex');
    }

    function closeQrModal() {
      document.getElementById('qrPayModal').classList.add('hidden');
      document.getElementById('qrPayModal').classList.remove('flex');
    }

    // ផ្ញើស្លីបទៅកាន់ Telegram
    document.getElementById('slipForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('sendSlipBtn');
      const file = document.getElementById('slipFileInput').files[0];
      const amount = document.getElementById('slipAmount').value;
      const uid = getUserId();
      const movieTitle = selectedMovieToPay ? selectedMovieToPay.title : 'វីដេអូ';
      const movieId = selectedMovieToPay ? selectedMovieToPay.id : '';

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-1">⏳</span> កំពុងផ្ញើទៅ Admin...`;

      try {
        const formData = new FormData();
        formData.append('chat_id', TELEGRAM_CHAT_ID);
        formData.append('photo', file);
        formData.append('parse_mode', 'HTML');
        formData.append('caption', `🔔 <b>មានការស្នើសុំទស្សនារឿង!</b>\n\n🎬 <b>រឿង:</b> ${movieTitle}\n👤 <b>User ID:</b> <code>${uid}</code>\n💵 <b>តម្លៃ:</b> $${amount}\n⏰ <b>ម៉ោង:</b> ${new Date().toLocaleTimeString()}`);
        
        const inlineKeyboard = {
          inline_keyboard: [
            [
              { text: `✅ ដាក់លុយ ($${amount})`, callback_data: `APPROVE:${uid}:${amount}:${movieId}` },
              { text: `❌ បោះបង់`, callback_data: `REJECT:${uid}` }
            ]
          ]
        };
        formData.append('reply_markup', JSON.stringify(inlineKeyboard));

        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        if (data.ok) {
          alert('វិក្កយបត្រត្រូវបានផ្ញើជូន Admin ជោគជ័យ! សូមរង់ចាំ Admin ចុច Approve ក្នុង Telegram នោះវីដេអូនឹងចាក់ជូនភ្លាមៗ។');
          closeQrModal();
          document.getElementById('slipForm').reset();
        } else {
          alert('មានបញ្ហាក្នុងការផ្ញើទៅកាន់ Bot');
        }
      } catch (err) {
        alert('ផ្ញើបរាជ័យ សូមពិនិត្យអ៊ីនធឺណិត');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send"></i> ផ្ញើវិក្កយបត្រទៅកាន់អេតមីន`;
        lucide.createIcons();
      }
    });

    // ត្រួតពិនិត្យការចុច Approve ពី Telegram Bot (Auto-Sync)
    let lastUpdateId = 0;
    async function checkTelegramUpdates() {
      try {
        const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}`);
        const data = await res.json();
        if (data.ok && data.result.length > 0) {
          for (const update of data.result) {
            lastUpdateId = update.update_id;

            if (update.callback_query) {
              const callbackData = update.callback_query.data;
              const [action, targetUid, amt, targetMovieId] = callbackData.split(':');
              const myUid = getUserId();

              if (targetUid === myUid) {
                if (action === 'APPROVE') {
                  const addAmt = parseFloat(amt);
                  setBalance(getBalance() + addAmt);
                  if (targetMovieId) {
                    addPurchasedMovie(targetMovieId);
                  }

                  await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery?callback_query_id=${update.callback_query.id}&text=បានអនុម័តជោគជ័យ!`);
                  await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageCaption`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      chat_id: TELEGRAM_CHAT_ID,
                      message_id: update.callback_query.message.message_id,
                      caption: `✅ <b>បានអនុម័តឱ្យ User ${myUid} ទស្សនារួចរាល់! ($${addAmt})</b>`,
                      parse_mode: 'HTML'
                    })
                  });

                  alert(`🎉 អបអរសាទរ! អេតមីនបានអនុម័តការបង់ប្រាក់រួចរាល់ហើយ។ សូមរីករាយទស្សនា!`);
                  if (targetMovieId) {
                    openPlayer(targetMovieId, 0);
                  }
                } else if (action === 'REJECT') {
                  await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery?callback_query_id=${update.callback_query.id}&text=បានបោះបង់!`);
                  await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageCaption`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                      chat_id: TELEGRAM_CHAT_ID,
                      message_id: update.callback_query.message.message_id,
                      caption: `❌ <b>បានបោះបង់ការស្នើសុំរបស់ User ${myUid}!</b>`,
                      parse_mode: 'HTML'
                    })
                  });

                  alert(`❌ ការស្នើសុំរបស់អ្នកត្រូវបានបដិសេធ។`);
                }
              }
            }
          }
        }
      } catch (e) {}
    }

    setInterval(checkTelegramUpdates, 3000);

    function loadData() {
      updateBalanceUI();
      const data = localStorage.getItem('angkor_movies');
      const movies = data ? JSON.parse(data) : defaultMovies;

      if (movies.length > 0) {
        const hero = movies[0];
        document.getElementById('heroSection').innerHTML = `
          <img src="${hero.cover}" class="absolute inset-0 w-full h-full object-cover -z-10 brightness-75" />
          <div class="absolute inset-0 bg-gradient-to-t from-[#0d0d11] via-[#0d0d11]/40 to-transparent -z-10"></div>
          <div class="max-w-xl">
            <span class="text-xs bg-amber-500 text-black font-black px-2 py-0.5 rounded uppercase tracking-wider mb-2 inline-block">តម្លៃ៖ ${hero.price}</span>
            <h1 class="text-3xl font-black mb-4">${hero.title}</h1>
            <button onclick="handleWatchClick('${hero.id}')" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-xl flex items-center gap-2 transition active:scale-95">
              <i data-lucide="play" class="w-5 h-5 fill-black"></i> ទស្សនាឥឡូវនេះ
            </button>
          </div>
        `;

        document.getElementById('moviesRow').innerHTML = movies.map(m => `
          <div onclick="handleWatchClick('${m.id}')" class="min-w-[140px] md:min-w-[170px] rounded-xl overflow-hidden bg-neutral-900 border border-neutral-800 cursor-pointer hover:border-amber-500 hover:scale-105 transition duration-200">
            <div class="relative">
              <img src="${m.cover}" class="w-full h-48 object-cover" />
              <span class="absolute top-2 right-2 bg-black/80 backdrop-blur-md text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded">${m.price}</span>
            </div>
            <div class="p-3">
              <p class="text-xs font-semibold truncate text-white">${m.title}</p>
              <p class="text-[10px] text-neutral-400 mt-0.5">${m.episodes ? m.episodes.length : 1} ភាគ</p>
            </div>
          </div>
        `).join('');
      }
      lucide.createIcons();
    }

    // Video Player
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('mainVideo');
    const videoSource = document.getElementById('videoSource');

    function openPlayer(movieId, epIndex = 0) {
      const data = localStorage.getItem('angkor_movies');
      const movies = data ? JSON.parse(data) : defaultMovies;
      currentMovie = movies.find(m => m.id === movieId);
      if (!currentMovie) return;

      const eps = currentMovie.episodes || [{ epTitle: 'ភាគ ១', videoUrl: currentMovie.videoUrl }];
      currentMovie.episodes = eps;

      playEpisode(epIndex);
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function playEpisode(index) {
      currentEpIndex = index;
      const ep = currentMovie.episodes[index];
      if (!ep) return;

      document.getElementById('playerMovieTitle').innerText = `${currentMovie.title} - ${ep.epTitle}`;
      videoSource.src = ep.videoUrl;
      video.load();
      video.play().catch(e => console.log('Autoplay prevent:', e));

      renderEpisodesList();
    }

    function renderEpisodesList() {
      const container = document.getElementById('episodesListContainer');
      container.innerHTML = currentMovie.episodes.map((ep, idx) => {
        const isActive = idx === currentEpIndex;
        return `
          <button onclick="playEpisode(${idx})" class="p-3 rounded-xl border text-xs font-bold transition flex items-center justify-between ${
            isActive 
              ? 'bg-amber-500 text-black border-amber-500 shadow-lg shadow-amber-500/20' 
              : 'bg-neutral-800/80 hover:bg-neutral-800 text-neutral-300 border-neutral-700 hover:border-neutral-500'
          }">
            <span class="truncate">${ep.epTitle}</span>
            <i data-lucide="${isActive ? 'volume-2' : 'play'}" class="w-4 h-4 shrink-0"></i>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    video.onended = () => {
      if (currentMovie && currentEpIndex + 1 < currentMovie.episodes.length) {
        playEpisode(currentEpIndex + 1);
      }
    };

    function closePlayer() {
      video.pause();
      videoSource.src = '';
      video.load();
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    loadData();
  </script>
</body>
</html>
