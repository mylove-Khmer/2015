<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC - Cloud Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style> body { font-family: 'Kantumruy Pro', sans-serif; background-color: #0b0b0f; } </style>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="text-white p-4 md:p-10 select-none">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center bg-neutral-900 border border-neutral-800 p-5 rounded-2xl shadow-xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500 text-black font-black flex items-center justify-center text-xl">A</div>
        <div>
          <h1 class="text-lg font-bold text-amber-400">ផ្ទាំងគ្រប់គ្រងភាពយន្ត (Auto-Sync)</h1>
          <p class="text-[11px] text-emerald-400 font-semibold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> ភ្ជាប់ជាមួយ Google Firebase រួចរាល់
          </p>
        </div>
      </div>
      <a href="index.html" class="text-xs bg-neutral-800 hover:bg-neutral-700 px-4 py-2.5 rounded-xl border border-neutral-700 transition">មើល Website</a>
    </header>

    <!-- Form បញ្ចូលរឿង -->
    <section class="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 shadow-xl space-y-4">
      <h2 class="text-base font-bold text-white border-b border-neutral-800 pb-3 flex items-center gap-2">
        <i data-lucide="plus-circle" class="text-amber-400 w-5 h-5"></i> បញ្ចូលរឿងថ្មី (ដាក់រូបភាព និងវីដេអូ)
      </h2>

      <form id="addMovieForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-neutral-400 block mb-1 font-medium">ចំណងជើងរឿង *</label>
            <input type="text" id="title" required placeholder="ឧ. រឿង កូនស្រីមេភូមិ" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-sm focus:border-amber-400 focus:outline-none">
          </div>
          <div>
            <label class="text-xs text-neutral-400 block mb-1 font-medium">តម្លៃ ($) *</label>
            <input type="text" id="price" required placeholder="ឧ. $2.50 ឬ Free" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-sm focus:border-amber-400 focus:outline-none">
          </div>
        </div>

        <!-- កន្លែងដាក់រូបភាព Poster (File Upload + URL Link) -->
        <div>
          <label class="text-xs text-neutral-400 block mb-1 font-medium">រូបភាព Poster រឿង (រើស File ឬដាក់ Link) *</label>
          <div class="flex flex-col sm:flex-row gap-3 items-start">
            <div class="w-full space-y-2">
              <input type="file" id="coverFileInput" accept="image/*" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-2.5 text-xs text-neutral-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-amber-500 file:text-black file:font-bold cursor-pointer">
              <input type="url" id="coverUrlInput" placeholder="ឬបិទភ្ជាប់តំណភ្ជាប់រូបភាព (Link URL)" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-xs focus:border-amber-400 focus:outline-none">
            </div>
            <!-- Preview រូប Poster -->
            <div class="w-24 h-32 rounded-xl bg-neutral-800 border border-neutral-700 overflow-hidden shrink-0 flex items-center justify-center">
              <img id="coverPreview" class="w-full h-full object-cover hidden" />
              <span id="noCoverText" class="text-[10px] text-neutral-500 text-center px-1">គ្មានរូប</span>
            </div>
          </div>
        </div>

        <!-- កន្លែងដាក់ Link វីដេអូ -->
        <div>
          <label class="text-xs text-neutral-400 block mb-1 font-medium">Link វីដេអូ «ភាគ ១» (Direct MP4 ពី Telegram Bot) *</label>
          <input type="url" id="videoUrl" required placeholder="https://...mp4" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 text-sm focus:border-amber-400 focus:outline-none">
          
          <div class="mt-2 flex items-center gap-2">
            <button type="button" onclick="testPlayVideo()" class="text-xs bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-3 py-1.5 rounded-lg border border-neutral-700 flex items-center gap-1">
              <i data-lucide="play-circle" class="w-3.5 h-3.5 text-amber-400"></i> តេស្តចាក់វីដេអូមើលសិន
            </button>
          </div>

          <div id="videoPreviewContainer" class="mt-3 hidden rounded-2xl overflow-hidden border border-neutral-800 bg-black aspect-video max-w-md">
            <video id="videoPreview" controls class="w-full h-full object-contain"></video>
          </div>
        </div>

        <button type="submit" id="saveBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3.5 rounded-xl transition active:scale-98 flex items-center justify-center gap-2 text-sm shadow-lg shadow-amber-500/10">
          <i data-lucide="upload-cloud" class="w-5 h-5"></i> ផ្សាយចេញភ្លាមៗ (ចូល Firebase Database)
        </button>
      </form>
    </section>

    <!-- បញ្ជីរឿង -->
    <section class="space-y-3">
      <h2 class="text-base font-bold flex items-center gap-2">
        <i data-lucide="film" class="w-4 h-4 text-amber-400"></i> បញ្ជីរឿងក្នុងប្រព័ន្ធ
      </h2>
      <div id="movieItems" class="space-y-3"></div>
    </section>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBDE90o2ObzHZXjiun3lrO5ubEHqg0BM6o",
      authDomain: "database-3986b.firebaseapp.com",
      projectId: "database-3986b",
      storageBucket: "database-3986b.firebasestorage.app",
      messagingSenderId: "1060738579533",
      appId: "1:1060738579533:web:17b0ba0db79322b8b1f004",
      measurementId: "G-MEWSC9Q0VL"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentCoverData = "";

    const form = document.getElementById('addMovieForm');
    const saveBtn = document.getElementById('saveBtn');
    const movieItems = document.getElementById('movieItems');
    const coverFileInput = document.getElementById('coverFileInput');
    const coverUrlInput = document.getElementById('coverUrlInput');
    const coverPreview = document.getElementById('coverPreview');
    const noCoverText = document.getElementById('noCoverText');

    // អាន File រូបភាពចេញពីម៉ាស៊ីន (Compress រូបបន្តិចដើម្បី save ចូល Firestore បានស្រួល)
    coverFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          const img = new Image();
          img.src = evt.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxDim = 600;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            currentCoverData = canvas.toDataURL('image/jpeg', 0.8);
            coverPreview.src = currentCoverData;
            coverPreview.classList.remove('hidden');
            noCoverText.classList.add('hidden');
            coverUrlInput.value = '';
          };
        };
        reader.readAsDataURL(file);
      }
    });

    coverUrlInput.addEventListener('input', function(e) {
      const url = e.target.value.trim();
      if (url) {
        currentCoverData = url;
        coverPreview.src = currentCoverData;
        coverPreview.classList.remove('hidden');
        noCoverText.classList.add('hidden');
        coverFileInput.value = '';
      }
    });

    function testPlayVideo() {
      const url = document.getElementById('videoUrl').value.trim();
      const cont = document.getElementById('videoPreviewContainer');
      const v = document.getElementById('videoPreview');
      if (!url) {
        alert('សូមបិទភ្ជាប់តំណភ្ជាប់វីដេអូជាមុនសិន!');
        return;
      }
      cont.classList.remove('hidden');
      v.src = url;
      v.load();
      v.play().catch(e => console.log(e));
    }

    // ទាញទិន្នន័យពី Firebase
    db.collection("movies").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      let html = "";
      if (snapshot.empty) {
        movieItems.innerHTML = `<div class="p-6 text-center text-xs text-neutral-500 bg-neutral-900 rounded-2xl border border-neutral-800">មិនទាន់មានរឿងនៅក្នុងប្រព័ន្ធទេ។</div>`;
        return;
      }

      snapshot.forEach((doc) => {
        const m = doc.data();
        html += `
          <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <img src="${m.cover}" class="w-12 h-16 object-cover rounded-xl bg-neutral-800 border border-neutral-700" />
              <div>
                <h4 class="text-sm font-bold text-white">${m.title}</h4>
                <span class="text-[10px] bg-amber-500/10 text-amber-400 font-bold px-2 py-0.5 rounded border border-amber-500/20">${m.price}</span>
              </div>
            </div>
            <button onclick="deleteMovie('${doc.id}')" class="text-red-400 bg-red-500/10 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-xl text-xs font-bold border border-red-500/20 transition">
              លុប
            </button>
          </div>
        `;
      });
      movieItems.innerHTML = html;
      lucide.createIcons();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentCoverData) {
        alert('សូមជ្រើសរើសរូបភាព Poster ឬដាក់ Link រូបភាពជាមុនសិន!');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerText = "កំពុងផ្សាយទៅ Cloud...";

      try {
        await db.collection("movies").add({
          title: document.getElementById('title').value.trim(),
          price: document.getElementById('price').value.trim(),
          cover: currentCoverData,
          episodes: [{ epTitle: "ភាគ ១", videoUrl: document.getElementById('videoUrl').value.trim() }],
          createdAt: Date.now()
        });

        form.reset();
        currentCoverData = "";
        coverPreview.src = "";
        coverPreview.classList.add('hidden');
        noCoverText.classList.remove('hidden');
        document.getElementById('videoPreviewContainer').classList.add('hidden');
        document.getElementById('videoPreview').pause();

        alert("🎉 ជោគជ័យ! រឿងត្រូវបានផ្សាយទៅលើ Website ភ្លាមៗ។");
      } catch (err) {
        alert("បរាជ័យ៖ " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `<i data-lucide="upload-cloud" class="w-5 h-5"></i> ផ្សាយចេញភ្លាមៗ (ចូល Firebase Database)`;
        lucide.createIcons();
      }
    });

    window.deleteMovie = async (id) => {
      if (confirm("តើអ្នកពិតជាចង់លុបរឿងនេះមែនទេ?")) {
        await db.collection("movies").doc(id).delete();
      }
    };

    lucide.createIcons();
  </script>
</body>
</html>
