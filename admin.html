<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kantumruy Pro', sans-serif; background-color: #0b0b0f; }
  </style>
</head>
<body class="text-white p-4 md:p-10 select-none">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Top Header -->
    <header class="flex justify-between items-center bg-neutral-900/80 border border-neutral-800 p-4 md:p-5 rounded-2xl backdrop-blur-md shadow-xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center font-black text-black text-xl shadow-lg shadow-amber-500/20">A</div>
        <div>
          <h1 class="text-lg md:text-xl font-bold text-amber-400 leading-none">Angkor DC Control Panel</h1>
          <p class="text-[11px] text-emerald-400 mt-1 flex items-center gap-1.5 font-semibold">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            Cloud Database Auto-Sync (Active)
          </p>
        </div>
      </div>
      <a href="index.html" class="text-xs bg-neutral-800 hover:bg-neutral-700 text-neutral-200 px-4 py-2.5 rounded-xl border border-neutral-700 font-semibold transition flex items-center gap-1.5 shadow-sm">
        <span>ទំព័រមុខ Website</span>
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
      </a>
    </header>

    <!-- Form បង្កើតរឿងថ្មី -->
    <section class="bg-neutral-900/90 border border-neutral-800 rounded-2xl p-5 md:p-7 shadow-xl">
      <h2 class="text-base font-bold mb-5 flex items-center gap-2 text-white border-b border-neutral-800 pb-3">
        <i data-lucide="plus-circle" class="text-amber-400 w-5 h-5"></i>
        <span>បង្កើតរឿងថ្មី (Auto-Save ចូលប្រព័ន្ធភ្លាម)</span>
      </h2>

      <form id="createMovieForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-neutral-400 block mb-1.5 font-medium">ចំណងជើងរឿង (ជាភាសាខ្មែរ) *</label>
            <input type="text" id="title" required placeholder="ឧ. បណ្តាសាក្រៅ ២" class="w-full bg-neutral-800/90 border border-neutral-700/80 rounded-xl p-3 text-sm focus:border-amber-400 focus:outline-none transition">
          </div>
          <div>
            <label class="text-xs text-neutral-400 block mb-1.5 font-medium">តម្លៃ ($) *</label>
            <input type="text" id="price" required placeholder="ឧ. $2.50 ឬ Free" class="w-full bg-neutral-800/90 border border-neutral-700/80 rounded-xl p-3 text-sm focus:border-amber-400 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1.5 font-medium">ជ្រើសរើសរូប Poster រឿង (Cover Image) *</label>
          <input type="file" id="coverFile" accept="image/*" required class="w-full bg-neutral-800/90 border border-neutral-700/80 rounded-xl p-2.5 text-xs text-neutral-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-amber-500 file:text-black file:font-bold cursor-pointer">
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1.5 font-medium">ជ្រើសរើសឯកសារវីដេអូសម្រាប់ «ភាគ ១» (.mp4) *</label>
          <input type="file" id="firstVideoFile" accept="video/mp4,video/*" required class="w-full bg-neutral-800/90 border border-neutral-700/80 rounded-xl p-2.5 text-xs text-neutral-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-amber-500 file:text-black file:font-bold cursor-pointer">
        </div>

        <button type="submit" id="createBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3.5 rounded-xl transition active:scale-98 flex items-center justify-center gap-2 text-sm shadow-lg shadow-amber-500/10">
          <i data-lucide="upload-cloud" class="w-5 h-5"></i>
          <span>Upload និងផ្សាយចេញភ្លាមៗ</span>
        </button>
      </form>
    </section>

    <!-- បញ្ជីរឿងទាំងអស់ -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold flex items-center gap-2">
          <i data-lucide="film" class="w-4 h-4 text-amber-400"></i>
          <span>បញ្ជីរឿងដែលមានក្នុងប្រព័ន្ធ</span>
        </h2>
        <button onclick="loadDatabaseData()" class="text-xs text-amber-400 hover:underline flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh បញ្ជី
        </button>
      </div>
      <div id="movieList" class="space-y-4"></div>
    </section>

  </div>

  <!-- Modal បន្ថែមភាគថ្មី -->
  <div id="addEpModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl max-w-md w-full relative shadow-2xl">
      <button onclick="closeEpModal()" class="absolute top-4 right-4 text-neutral-400 hover:text-white bg-neutral-800 p-1.5 rounded-full">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <h3 class="text-base font-bold text-amber-400 mb-1" id="modalMovieTitle">បន្ថែមភាគថ្មី</h3>
      <p class="text-xs text-neutral-400 mb-4">ជ្រើសរើស File វីដេអូសម្រាប់ភាគបន្តបន្ទាប់</p>

      <form id="addEpForm" class="space-y-4">
        <input type="hidden" id="modalMovieId">
        <div>
          <label class="text-xs text-neutral-400 block mb-1 font-medium">ឈ្មោះភាគ *</label>
          <input type="text" id="epName" required placeholder="ឧ. ភាគ ២" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-2.5 text-sm focus:border-amber-400 focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-neutral-400 block mb-1 font-medium">ជ្រើសរើសឯកសារវីដេអូ (.mp4) *</label>
          <input type="file" id="epVideoFile" accept="video/mp4,video/*" required class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-2 text-xs file:mr-3 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:bg-amber-500 file:text-black file:font-bold cursor-pointer">
        </div>
        <button type="submit" id="modalUploadBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-lg shadow-amber-500/10">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Upload ភាគថ្មីនេះ</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    const CLOUD_NAME = "slntwp4h";
    const UPLOAD_PRESET = "my_preset";
    // KV Cloud Database Endpoint
    const DB_ENDPOINT = "https://kvdb.io/4y9hN7hG6zZ7k6b3W8r1M5/angkor_movies";

    let movies = [];

    const defaultMovies = [
      {
        id: "1788290203964",
        title: "ចុចខាងក្រោមដើម្បីមើល",
        price: "$3.00",
        cover: "https://res.cloudinary.com/slntwp4h/image/upload/v1788290200/r1qciu7hh8htejj4kw5r.jpg",
        episodes: [
          { epTitle: "ភាគ ១", videoUrl: "https://res.cloudinary.com/slntwp4h/video/upload/v1788290202/kuzl8kl8mkiazw5fl0vc.mp4" }
        ]
      }
    ];

    async function loadDatabaseData() {
      try {
        const res = await fetch(DB_ENDPOINT + '?t=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          movies = Array.isArray(data) && data.length > 0 ? data : defaultMovies;
        } else {
          movies = defaultMovies;
        }
      } catch (e) {
        movies = defaultMovies;
      }
      renderList();
    }

    async function syncToDatabase(newList) {
      movies = newList;
      renderList();
      try {
        await fetch(DB_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newList)
        });
      } catch (e) {
        console.error('Database Sync Error:', e);
      }
    }

    function uploadToCloudWithProgress(file, resourceType, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);
        xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && onProgress) {
            const percent = Math.round((e.loaded / e.total) * 100);
            onProgress(percent);
          }
        };

        xhr.onload = () => {
          try {
            const data = JSON.parse(xhr.responseText);
            if (xhr.status === 200 && data.secure_url) {
              resolve(data.secure_url);
            } else {
              reject(data.error ? data.error.message : 'Upload failed');
            }
          } catch (err) {
            reject('Error parsing response');
          }
        };
        xhr.onerror = () => reject('Network error');
        xhr.send(formData);
      });
    }

    function renderList() {
      const container = document.getElementById('movieList');
      if (!movies || movies.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-neutral-500 bg-neutral-900 rounded-2xl border border-neutral-800">មិនទាន់មានរឿងនៅឡើយទេ។</div>`;
        return;
      }

      container.innerHTML = movies.map(m => `
        <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-4 md:p-5 shadow-lg">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-neutral-800 pb-4">
            <div class="flex items-center gap-4">
              <img src="${m.cover}" class="w-16 h-22 object-cover rounded-xl bg-neutral-800 border border-neutral-700" />
              <div>
                <h3 class="font-bold text-base text-white">${m.title}</h3>
                <span class="inline-block mt-1 text-xs bg-amber-500/10 text-amber-400 font-bold px-2.5 py-0.5 rounded-lg border border-amber-500/20">${m.price}</span>
                <p class="text-xs text-neutral-400 mt-1">មានចំនួន៖ <b class="text-white">${m.episodes ? m.episodes.length : 1} ភាគ</b></p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="openEpModal('${m.id}', '${m.title}', ${m.episodes ? m.episodes.length + 1 : 2})" class="bg-amber-500 hover:bg-amber-400 text-black px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> បន្ថែមភាគថ្មី
              </button>
              <button onclick="deleteMovie('${m.id}')" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-3 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1 border border-red-500/20">
                <i data-lucide="trash-2" class="w-4 h-4"></i> លុបរឿង
              </button>
            </div>
          </div>

          <div class="mt-3.5">
            <p class="text-[11px] text-neutral-400 mb-2 font-medium">ភាគដែលមានស្រាប់៖</p>
            <div class="flex flex-wrap gap-2">
              ${(m.episodes || []).map((ep, idx) => `
                <div class="bg-neutral-800 border border-neutral-700 text-xs px-3 py-1.5 rounded-xl flex items-center gap-2">
                  <span>${ep.epTitle}</span>
                  <button onclick="deleteEpisode('${m.id}', ${idx})" class="text-neutral-500 hover:text-red-400 transition">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    }

    document.getElementById('createMovieForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('createBtn');
      const coverFile = document.getElementById('coverFile').files[0];
      const videoFile = document.getElementById('firstVideoFile').files[0];

      if (!coverFile || !videoFile) {
        alert('សូមជ្រើសរើសរូប Poster និង File វីដេអូ!');
        return;
      }

      btn.disabled = true;

      try {
        btn.innerHTML = `កំពុង Upload Poster (0%)...`;
        const coverUrl = await uploadToCloudWithProgress(coverFile, 'image', (p) => {
          btn.innerHTML = `កំពុង Upload Poster (${p}%)...`;
        });

        btn.innerHTML = `កំពុង Upload វីដេអូ (0%)... សូមរង់ចាំ`;
        const videoUrl = await uploadToCloudWithProgress(videoFile, 'video', (p) => {
          btn.innerHTML = `កំពុង Upload វីដេអូ (${p}%)...`;
        });

        const newMovie = {
          id: Date.now().toString(),
          title: document.getElementById('title').value,
          price: document.getElementById('price').value,
          cover: coverUrl,
          episodes: [{ epTitle: 'ភាគ ១', videoUrl: videoUrl }]
        };

        btn.innerHTML = `កំពុងរក្សាទុកក្នុង Database...`;
        await syncToDatabase([newMovie, ...movies]);
        
        e.target.reset();
        alert('🎉 បាន Upload និងរក្សាទុកក្នុង Database ជោគជ័យ ១០០%! ភ្ញៀវអាចមើលឃើញភ្លាមៗ។');
      } catch (err) {
        alert('មានបញ្ហាក្នុងការ Upload៖ ' + err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="upload-cloud" class="w-5 h-5"></i> <span>Upload និងផ្សាយចេញភ្លាមៗ</span>`;
        lucide.createIcons();
      }
    });

    function openEpModal(id, title, nextEpNum) {
      document.getElementById('modalMovieId').value = id;
      document.getElementById('modalMovieTitle').innerText = `បន្ថែមភាគសម្រាប់៖ ${title}`;
      document.getElementById('epName').value = `ភាគ ${nextEpNum}`;
      document.getElementById('addEpModal').classList.remove('hidden');
      document.getElementById('addEpModal').classList.add('flex');
    }

    function closeEpModal() {
      document.getElementById('addEpModal').classList.add('hidden');
      document.getElementById('addEpModal').classList.remove('flex');
      document.getElementById('addEpForm').reset();
    }

    document.getElementById('addEpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('modalUploadBtn');
      const id = document.getElementById('modalMovieId').value;
      const epTitle = document.getElementById('epName').value;
      const videoFile = document.getElementById('epVideoFile').files[0];

      if (!videoFile) {
        alert('សូមជ្រើសរើស File វីដេអូ!');
        return;
      }

      btn.disabled = true;

      try {
        btn.innerHTML = `កំពុង Upload...`;
        const videoUrl = await uploadToCloudWithProgress(videoFile, 'video', (p) => {
          btn.innerHTML = `កំពុង Upload (${p}%)...`;
        });

        const movie = movies.find(m => m.id === id);
        if (movie) {
          if (!movie.episodes) movie.episodes = [];
          movie.episodes.push({ epTitle, videoUrl });
          await syncToDatabase([...movies]);
        }
        closeEpModal();
        alert('🎉 បានបន្ថែមភាគថ្មី និងរក្សាទុកជោគជ័យ!');
      } catch (err) {
        alert('Upload ភាគថ្មីបរាជ័យ៖ ' + err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="plus" class="w-4 h-4"></i> <span>Upload ភាគថ្មីនេះ</span>`;
        lucide.createIcons();
      }
    });

    async function deleteMovie(id) {
      if (confirm('តើអ្នកពិតជាចង់លុបរឿងនេះមែនទេ?')) {
        await syncToDatabase(movies.filter(m => m.id !== id));
      }
    }

    async function deleteEpisode(movieId, epIdx) {
      if (confirm('តើអ្នកចង់ដកភាគនេះចេញមែនទេ?')) {
        const movie = movies.find(m => m.id === movieId);
        if (movie && movie.episodes) {
          movie.episodes.splice(epIdx, 1);
          await syncToDatabase([...movies]);
        }
      }
    }

    loadDatabaseData();
  </script>
</body>
</html>
