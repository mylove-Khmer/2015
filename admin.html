<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angkor DC - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { background-color: #0b0b0e; }</style>
</head>
<body class="text-white p-4 md:p-10 font-sans">
  <div class="max-w-3xl mx-auto">
    
    <div class="flex justify-between items-center mb-6 border-b border-neutral-800 pb-4">
      <h1 class="text-xl md:text-2xl font-black text-amber-400 flex items-center gap-2">
        <i data-lucide="shield-check"></i> Admin (បញ្ចូលវីដេអូផ្ទាល់)
      </h1>
      <a href="index.html" class="text-xs bg-neutral-800 hover:bg-neutral-700 px-3 py-2 rounded-lg border border-neutral-700">
        ទំព័រភ្ញៀវ ↗
      </a>
    </div>

    <!-- Form បញ្ចូល -->
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 mb-8 shadow-xl">
      <h2 class="text-base font-bold mb-4 flex items-center gap-2 text-white">
        <i data-lucide="plus-circle" class="text-amber-400"></i> បញ្ចូលវីដេអូថ្មី
      </h2>
      <form id="movieForm" class="space-y-4">
        <div>
          <label class="text-xs text-neutral-400 block mb-1">ចំណងជើងរឿង (ភាសាខ្មែរ)</label>
          <input type="text" id="title" required placeholder="ឧ. បណ្តាសាក្រៅ ២" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-sm focus:border-amber-400 focus:outline-none">
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1">តម្លៃ ($)</label>
          <input type="text" id="price" required placeholder="ឧ. $2.50 ឬ Free" class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 text-sm focus:border-amber-400 focus:outline-none">
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1">ជ្រើសរើសរូប Poster ពីរូបភាពក្នុងម៉ាស៊ីន</label>
          <input type="file" id="coverFile" accept="image/*" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-sm file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:bg-amber-500 file:text-black file:font-bold cursor-pointer">
        </div>

        <div>
          <label class="text-xs text-neutral-400 block mb-1">ជ្រើសរើសឯកសារវីដេអូ (.mp4)</label>
          <input type="file" id="videoFile" accept="video/mp4,video/*" required class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-2 text-sm file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:bg-amber-500 file:text-black file:font-bold cursor-pointer">
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3.5 rounded-lg transition active:scale-98 flex items-center justify-center gap-2">
          <i data-lucide="upload-cloud"></i> បញ្ចូល និងរក្សាទុក
        </button>
      </form>
    </div>

    <!-- បញ្ជីវីដេអូ -->
    <h2 class="text-base font-bold mb-3">បញ្ជីភាពយន្ត</h2>
    <div class="bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden">
      <div id="movieTable" class="divide-y divide-neutral-800"></div>
    </div>

  </div>

  <script>
    // ភ្ជាប់ព័ត៌មាន Cloudinary របស់អ្នក
    const CLOUD_NAME = "slntwp4h"; 
    const UPLOAD_PRESET = "my_preset";

    const defaultMovies = [
      { id: '1', title: 'បណ្តាសាក្រៅ ២', price: '$2.50', cover: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=400&q=80', videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4' }
    ];

    function getMovies() {
      const data = localStorage.getItem('angkor_movies');
      return data ? JSON.parse(data) : defaultMovies;
    }

    function saveMovies(movies) {
      localStorage.setItem('angkor_movies', JSON.stringify(movies));
      renderList();
    }

    function renderList() {
      const list = getMovies();
      const container = document.getElementById('movieTable');
      if (list.length === 0) {
        container.innerHTML = `<p class="p-6 text-center text-neutral-500 text-sm">មិនទាន់មានវីដេអូទេ។</p>`;
        return;
      }
      container.innerHTML = list.map(m => `
        <div class="flex items-center justify-between p-4 hover:bg-neutral-800/40 transition">
          <div class="flex items-center gap-3">
            <img src="${m.cover}" class="w-12 h-16 object-cover rounded-lg bg-neutral-800" />
            <div>
              <p class="font-bold text-sm text-white">${m.title}</p>
              <span class="inline-block mt-1 text-xs bg-amber-500/10 text-amber-400 font-bold px-2 py-0.5 rounded border border-amber-500/20">${m.price}</span>
            </div>
          </div>
          <button onclick="deleteMovie('${m.id}')" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1">
            <i data-lucide="trash-2" class="w-4 h-4"></i> ដកចេញ
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function deleteMovie(id) {
      if (confirm('តើអ្នកចង់ដកវីដេអូនេះចោលមែនទេ?')) {
        const list = getMovies().filter(m => m.id !== id);
        saveMovies(list);
      }
    }

    // Function Upload ឯកសារឡើង Cloudinary
    async function uploadToCloud(file, resourceType) {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
        method: 'POST',
        body: formData
      });
      const data = await res.json();
      if (!data.secure_url) {
        throw new Error('Upload Failed');
      }
      return data.secure_url;
    }

    document.getElementById('movieForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-2">⏳</span> កំពុង Upload វីដេអូ សូមរង់ចាំ...`;

      try {
        const coverFile = document.getElementById('coverFile').files[0];
        const videoFile = document.getElementById('videoFile').files[0];

        const coverUrl = await uploadToCloud(coverFile, 'image');
        const videoUrl = await uploadToCloud(videoFile, 'video');

        const list = getMovies();
        const newMovie = {
          id: Date.now().toString(),
          title: document.getElementById('title').value,
          price: document.getElementById('price').value,
          cover: coverUrl,
          videoUrl: videoUrl
        };

        list.unshift(newMovie);
        saveMovies(list);
        e.target.reset();
        alert('បានបញ្ចូលវីដេអូជោគជ័យ!');
      } catch (err) {
        alert('មានបញ្ហាក្នុងការ Upload សូមពិនិត្យមើលទំហំឯកសារ ឬល្បឿនអ៊ីនធឺណិត');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="upload-cloud"></i> បញ្ចូល និងរក្សាទុក`;
        lucide.createIcons();
      }
    });

    renderList();
  </script>
</body>
</html>
